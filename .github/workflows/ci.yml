name: CI (model/operation verification)

# 設計資産（assets/logipoke-*.js）の自動検証。Node 標準APIのみで動作する
# migration/verify_*.mjs を PR と main への push で実行する（外部依存なし）。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify data model / adapters (lossless round-trip)
        run: node migration/verify_model.mjs
      - name: Verify scale-out judgement
        run: node migration/verify_scaleout.mjs
      - name: Verify recommend engine
        run: node migration/verify_recommend.mjs
      - name: Verify case-dependent AI scoring
        run: node migration/verify_aiscore.mjs
      - name: Verify operation-layer SSoT (C6)
        run: node migration/verify_operation.mjs
      - name: Verify case-layer unify (C7)
        run: node migration/verify_cases.mjs
